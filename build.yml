
name: Build Blossom Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Blossom Client
        run: gradle build

      - name: Prepare JAR
        run: |
          mkdir -p dist
          cp build/libs/blossom-client-1.0.0.jar dist/Blossom-Client.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Blossom-Client
          path: dist/Blossom-Client.jar
