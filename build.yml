name: Build Blossom Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (no wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        run: gradle build

      - name: Prepare distributable JAR
        shell: bash
        run: |
          mkdir -p dist
          MOD_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$MOD_JAR"
          cp "$MOD_JAR" dist/Blossom-Client.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Blossom-Client
          path: dist/Blossom-Client.jar
          if-no-files-found: error
